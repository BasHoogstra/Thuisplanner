# KomtGoed (werknaam): configuratie voor de Supabase CLI, alleen voor LOKALE ontwikkeling.
# Staat bewust los van supabase/config.toml (Huisplan). Deze map is aan geen enkel Supabase-project
# gekoppeld (geen `supabase link`); KG-1 wordt nergens gedeployd. Poorten wijken af van Huisplan,
# zodat beide lokaal naast elkaar kunnen draaien. Niet genoemde instellingen: CLI-standaardwaarden.
project_id = "komtgoed"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# Alleen lokaal (supabase start en db reset; nooit bij db push naar een online project): de lokale ontwikkelmodus
# voor de fictieve accounts. Zie seed.sql.
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Aan sinds KG-5B, alleen om te bewijzen dat er niets uitlekt: geen tabel staat in een publicatie
# (dus postgres_changes stuurt niets) en private kanalen zijn dicht (geen policies op realtime.messages).
# Wijzigingen worden later alleen als 'ping' via private kanalen gemeld (bouwplan stap 5).
enabled = true

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
# Nog niet nodig in KG-1 (geen bestanden).
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://127.0.0.1:3100"]
jwt_expiry = 3600
enable_signup = true

# KG-5H deel 2: inloggen alleen met een code (K1). Zie docs/thuisplanner-deel2-bouwscope.md. Online gelden dezelfde
# waarden (checklist en nacontrole), behalve max_frequency: online 60s, lokaal 1s zodat de tests snel kunnen.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
# De interne code van Supabase: 10 cijfers, nooit gemaild (de Send Email-hook stuurt de eigen code van 6 cijfers).
otp_length = 10
otp_expiry = 600

# Alle mail van Supabase Auth loopt via de codelaag (functions/stuur-code). Het geheim komt uit supabase/.env
# (k1-lokaal.mjs; nooit in de repository).
[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:55321/functions/v1/stuur-code"
secrets = "env(K1_HOOK_SECRET)"

[functions.stuur-code]
verify_jwt = false

[functions.controleer-code]
verify_jwt = false

[analytics]
enabled = false
